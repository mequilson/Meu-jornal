<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Jornal - Gerir Notícias</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}

nav a{
  text-decoration:none;
  color:#111827;
  background:#e5e7eb;
  padding:10px 14px;
  border-radius:6px;
  font-weight:bold;
}

.container{
  width:94%;
  max-width:900px;
  margin:20px auto;
}

.caixa{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.noticia{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.noticia h3{
  margin-top:0;
}

.noticia img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:8px;
  margin:10px 0;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.editar{
  background:#2563eb;
  color:white;
}

.apagar{
  background:#dc2626;
  color:white;
}

.voltar{
  background:#111827;
  color:white;
}

.vazio{
  text-align:center;
  padding:25px;
  color:#666;
}
</style>
</head>

<body>

<header>
<h1>MEU JORNAL</h1>
<p>Gerir Notícias</p>
</header>

<nav>
<a href="./index.html">INÍCIO</a>
<a href="./publicar.html">PUBLICAR</a>
<a href="./noticias.html">NOTÍCIAS</a>
<a href="./rendimento.html">RENDIMENTO</a>
<a href="./admin.html">ADMINISTRAÇÃO</a>
</nav>

<div class="container">

<div class="caixa">

<h2>Notícias publicadas</h2>

<div id="listaNoticias"></div>

</div>

<div class="caixa">
<button class="voltar" onclick="voltarInicio()">
VOLTAR AO INÍCIO
</button>
</div>

</div>

<script>

function carregarNoticias(){

var lista =
JSON.parse(
localStorage.getItem("meuJornalNoticias")
) || [];

var area =
document.getElementById("listaNoticias");

area.innerHTML="";

if(lista.length===0){

area.innerHTML=
'<div class="vazio">Nenhuma notícia publicada.</div>';

return;
}

lista.forEach(function(noticia,index){

var titulo =
noticia.titulo || "Sem título";

var texto =
noticia.texto || "";

var categoria =
noticia.categoria || "";

var imagem =
noticia.imagem ||
noticia.foto ||
noticia.imagemUrl ||
"";

var div =
document.createElement("div");

div.className="noticia";

var html="";

html+="<h3>"+escapar(titulo)+"</h3>";

if(categoria){
html+="<p><strong>Categoria:</strong> "+
escapar(categoria)+"</p>";
}

if(imagem){

html+="<img src='"+
imagem+
"' alt='Imagem da notícia'>";

}

html+="<p>"+
escapar(texto)+
"</p>";

html+="<button class='editar' onclick='editarNoticia("+
index+
")'>EDITAR</button>";

html+="<button class='apagar' onclick='apagarNoticia("+
index+
")'>APAGAR</button>";

div.innerHTML=html;

area.appendChild(div);

});

}


function escapar(texto){

return String(texto)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function apagarNoticia(index){

var lista =
JSON.parse(
localStorage.getItem("meuJornalNoticias")
) || [];

if(!confirm("Tem certeza que deseja apagar esta notícia?")){
return;
}

lista.splice(index,1);

localStorage.setItem(
"meuJornalNoticias",
JSON.stringify(lista)
);

carregarNoticias();

}


function editarNoticia(index){

localStorage.setItem(
"meuJornalEditar",
String(index)
);

window.location.href="./publicar.html";

}


function voltarInicio(){

window.location.href="./index.html";

}


carregarNoticias();

</script>

</body>
</html>
