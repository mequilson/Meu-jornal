<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Jornal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f1f1;
    color:#222;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:20px 10px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

nav{
    background:white;
    padding:10px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

nav button{
    background:#111;
    color:white;
    border:0;
    padding:11px 17px;
    border-radius:5px;
    font-size:15px;
}

main{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.pagina{
    display:none;
}

.pagina.ativa{
    display:block;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.card img{
    display:block;
    width:100%;
    max-height:450px;
    object-fit:cover;
    border-radius:7px;
    margin:10px 0;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    min-height:170px;
}

.botao{
    background:#111;
    color:white;
    border:0;
    padding:12px 18px;
    border-radius:5px;
    margin:4px;
    font-size:15px;
}

.apagar{
    background:#b00020;
}

#preview{
    display:none;
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:7px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<header>
    <h1>MEU JORNAL</h1>
    <p>Informação que chega até você.</p>
</header>

<nav>
    <button onclick="mostrarPagina('inicio')">
        Início
    </button>

    <button onclick="mostrarPagina('noticias')">
        Notícias
    </button>

    <button onclick="mostrarPagina('publicar')">
        Publicar
    </button>

    <button onclick="mostrarPagina('gerir')">
        Gerir
    </button>
</nav>

<main>

<!-- INÍCIO -->
<section id="inicio" class="pagina ativa">
