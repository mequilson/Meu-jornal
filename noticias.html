<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meu Jornal - Notícias</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

header p{
    margin:6px 0 0;
}

nav{
    background:#1f2937;
    text-align:center;
    padding:12px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 6px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:15px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.topo h2{
    margin:0;
}

.botao-publicar{
    background:#16a34a;
    color:white;
    text-decoration:none;
    padding:11px 15px;
    border-radius:8px;
    font-weight:bold;
}

.noticia{
    background:white;
    margin-bottom:25px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.noticia-imagem{
    width:100%;
    max-height:400px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin-bottom:15px;
}

.sem-imagem{
    display:none;
}

.noticia h3{
    margin:5px 0 10px;
    font-size:24px;
}

.info{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.categoria{
    display:inline-block;
    background:#e5e7eb;
    padding:5px 9px;
    border-radius:5px;
    margin-right:8px;
    font-weight:bold;
}

.texto{
    line-height:1.6;
    white-space:pre-line;
}

.botao-ver{
    display:inline-block;
    background:#111827;
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:7px;
    margin-top:12px;
    font-weight:bold;
}

.sem-noticias{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:12px;
}

@media(max-width:600px){

    .topo{
        flex-direction:column;
        align-items:stretch;
    }

    .botao-publicar{
        text-align:center;
    }

    .noticia h3{
        font-size:21px;
    }

}

</style>

</head>

<body>

<header>

<h1>MEU JORNAL</h1>

<p>Informação que chega até você.</p>

</header>

<nav>

<a href="index.html">INÍCIO</a>

<a href="publicar.html">PUBLICAR</a>

<a href="noticias.html">NOTÍCIAS</a>

<a href="rendimento.html">RENDIMENTO</a>

</nav>


<div class="container">

<div class="topo">

<h2>Últimas Notícias</h2>

<a
href="publicar.html"
class="botao-publicar">

PUBLICAR NOVA NOTÍCIA

</a>

</div>


<div id="listaNoticias"></div>

</div>


<script>

function carregarNoticias(){

var lista=
document.getElementById(
"listaNoticias"
);

var noticias=
JSON.parse(
localStorage.getItem(
"meuJornalNoticias"
)
) || [];


lista.innerHTML="";


if(noticias.length===0){

lista.innerHTML=`

<div class="sem-noticias">

<h3>Nenhuma notícia publicada</h3>

<p>
Vá para Publicar e adicione a primeira notícia.
</p>

<a
href="publicar.html"
class="botao-ver">

PUBLICAR NOTÍCIA

</a>

</div>

`;

return;

}


/*
Mostra a notícia mais recente
primeiro, sem alterar o
índice original.
*/

for(
var i=noticias.length-1;
i>=0;
i--
){

var noticia=noticias[i];

var artigo=
document.createElement("div");

artigo.className="noticia";


var imagemHTML="";


if(
noticia.imagem &&
typeof noticia.imagem==="string"
){

imagemHTML=`

<img
class="noticia-imagem"
src="${noticia.imagem}"
alt="Imagem da notícia"
>

`;

}


var titulo=
noticia.titulo || "Sem título";

var autor=
noticia.autor || "Autor não informado";

var data=
noticia.data || "";

var categoria=
noticia.categoria || "Outras";

var texto=
noticia.texto || "";


/*
Mostra apenas uma parte
do texto na página de notícias.
*/

var resumo=texto;

if(resumo.length>250){

resumo=
resumo.substring(0,250)+"...";

}


artigo.innerHTML=`

${imagemHTML}

<h3>
${titulo}
</h3>

<div class="info">

<span class="categoria">
${categoria}
</span>

Autor: ${autor}

${data ? " | Data: "+data : ""}

</div>

<div class="texto">
${resumo}
</div>

<a
href="leitura.html?id=${i}"
class="botao-ver">

VER NOTÍCIA

</a>

`;


lista.appendChild(artigo);

}

}


carregarNoticias();

</script>

</body>
</html>
