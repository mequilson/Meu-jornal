<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Jornal - Notícias</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
}

nav {
  background: #222;
  padding: 10px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
}

h2 {
  text-align: center;
}

.noticia {
  background: white;
  margin-bottom: 20px;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.noticia img {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
  margin-bottom: 15px;
}

.noticia h3 {
  margin: 5px 0 10px;
  font-size: 22px;
}

.noticia p {
  line-height: 1.5;
}

.data {
  color: #777;
  font-size: 14px;
  margin-bottom: 10px;
}

.botao {
  display: inline-block;
  background: #111;
  color: white;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 6px;
  margin-top: 10px;
}

.botao:hover {
  background: #333;
}

.sem-noticias {
  background: white;
  padding: 25px;
  text-align: center;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>MEU JORNAL</h1>
  <p>Informação que chega até você.</p>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="noticias.html">Notícias</a>
  <a href="publicar.html">Publicar</a>
</nav>

<div class="container">

  <h2>Últimas Notícias</h2>

  <div id="listaNoticias"></div>

</div>

<script>

function carregarNoticias() {

  const lista = document.getElementById("listaNoticias");

  let noticias = JSON.parse(
    localStorage.getItem("meuJornalNoticias") || "[]"
  );

  lista.innerHTML = "";

  if (noticias.length === 0) {

    lista.innerHTML = `
      <div class="sem-noticias">
        <p>Nenhuma notícia publicada.</p>
      </div>
    `;

    return;
  }

  noticias.reverse();

  noticias.forEach(function(noticia, indice) {

    const artigo = document.createElement("div");

    artigo.className = "noticia";

    let imagem = "";

    if (noticia.imagem) {

      imagem = `
        <img
          src="${noticia.imagem}"
          alt="Imagem da notícia"
          onerror="this.style.display='none'"
        >
      `;

    }

    const titulo = noticia.titulo || "Sem título";

    const texto = noticia.texto || "";

    const data = noticia.data || "";

    artigo.innerHTML = `

      ${imagem}

      <h3>${titulo}</h3>

      ${data ? `<div class="data">${data}</div>` : ""}

      <p>
        ${texto.substring(0, 180)}
        ${texto.length > 180 ? "..." : ""}
      </p>

      <a
        class="botao"
        href="leitura.html?id=${indice}"
      >
        Ver notícia
      </a>

    `;

    lista.appendChild(artigo);

  });

}

carregarNoticias();

</script>

</body>
</html>
