
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Jornal - Gerir Notícias</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#222}
header{background:#111827;color:white;text-align:center;padding:25px 15px}
header h1{margin:0;font-size:30px}
nav{background:white;padding:12px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
nav a{text-decoration:none;color:#111827;background:#e5e7eb;padding:10px 14px;border-radius:6px;font-weight:bold}
.container{width:94%;max-width:900px;margin:20px auto}
.caixa{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px #00000014}
.noticia{border:1px solid #ccc;border-radius:10px;padding:18px;margin-bottom:18px;background:white}
.noticia h3{margin-top:0;font-size:22px;overflow-wrap:anywhere}
.noticia img{display:block;width:100%;max-height:250px;object-fit:cover;border-radius:8px;margin:12px 0}
.botoes{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
button{border:0;padding:13px 18px;border-radius:7px;font-weight:bold;font-size:15px;cursor:pointer}
.editar{background:#2563eb;color:white}
.apagar{background:#dc2626;color:white}
.voltar{background:#111827;color:white;width:100%}
.vazio{text-align:center;padding:25px;color:#666}
.estado{padding:12px;border-radius:7px;background:#e5e7eb;margin-bottom:15px}
@media(max-width:600px){.botoes{flex-direction:column}button{width:100%}}
</style>
</head>

<body>
<header>
<h1>MEU JORNAL</h1>
<p>Gerir Notícias</p>
</header>

<nav>
<a href="./index.html">INÍCIO</a>
<a href="./publicar.html">PUBLICAR</a>
<a href="./noticias.html">NOTÍCIAS</a>
<a href="./rendimento.html">RENDIMENTO</a>
<a href="./admin.html">ADMINISTRAÇÃO</a>
</nav>

<div class="container">
<div class="caixa">
<h2>Notícias publicadas</h2>
<div id="estado" class="estado">A carregar notícias...</div>
<div id="listaNoticias"></div>
</div>

<div class="caixa">
<button class="voltar" onclick="voltarInicio()">VOLTAR AO INÍCIO</button>
</div>
</div>

<script>
function escapar(texto){
return String(texto ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function obterNoticias(){
try{
var dados=localStorage.getItem("meuJornalNoticias");
var lista=dados ? JSON.parse(dados) : [];
return Array.isArray(lista) ? lista : [];
}catch(erro){
return [];
}
}

function carregarNoticias(){
var lista=obterNoticias();
var area=document.getElementById("listaNoticias");
var estado=document.getElementById("estado");

area.innerHTML="";

estado.textContent="Total de notícias: "+lista.length;

if(lista.length===0){
area.innerHTML='<div class="vazio">Nenhuma notícia encontrada neste navegador.</div>';
return;
}

lista.forEach(function(noticia,index){
var div=document.createElement("div");
div.className="noticia";

var titulo=escapar(noticia.titulo || "Sem título");
var texto=escapar(noticia.texto || "");
var categoria=escapar(noticia.categoria || "Sem categoria");

var conteudo="<h3>"+titulo+"</h3>";
conteudo+="<p><strong>Categoria:</strong> "+categoria+"</p>";

var imagem=noticia.imagem || noticia.foto || noticia.imagemUrl || "";

if(imagem && typeof imagem==="string" && imagem.startsWith("data:image/")){
conteudo+='<img src="'+imagem+'" alt="Imagem da notícia">';
}

conteudo+='<p>'+texto+'</p>';
conteudo+='<div class="botoes">';
conteudo+='<button type="button" class="editar" data-acao="editar" data-indice="'+index+'">EDITAR</button>';
conteudo+='<button type="button" class="apagar" data-acao="apagar" data-indice="'+index+'">APAGAR NOTÍCIA</button>';
conteudo+='</div>';

div.innerHTML=conteudo;
area.appendChild(div);
});
}

document.getElementById("listaNoticias").addEventListener("click",function(event){
var botao=event.target.closest("button[data-acao]");
if(!botao)return;

var index=Number(botao.dataset.indice);
var lista=obterNoticias();

if(!Number.isInteger(index) || index<0 || index>=lista.length){
alert("Não foi possível localizar esta notícia. Atualize a página.");
return;
}

if(botao.dataset.acao==="apagar"){
if(!confirm('Tem certeza de que deseja apagar a notícia "'+(lista[index].titulo || "Sem título")+'"?'))return;

lista.splice(index,1);

try{
localStorage.setItem("meuJornalNoticias",JSON.stringify(lista));
carregarNoticias();
alert("Notícia apagada com sucesso.");
}catch(erro){
alert("Não foi possível guardar a alteração neste navegador.");
}
}

if(botao.dataset.acao==="editar"){
localStorage.setItem("meuJornalEditar",String(index));
window.location.href="./publicar.html";
}
});

function voltarInicio(){
window.location.href="./index.html";
}

carregarNoticias();
</script>
</body>
</html>
