<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias - Meu Jornal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    header {
      background: #0b4f9c;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      padding: 20px;
    }

    .noticia {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .noticia img {
      width: 100%;
      border-radius: 8px;
    }

    .noticia h2 {
      color: #0b4f9c;
    }

    .botao {
      display: inline-block;
      background: #0b4f9c;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>
  <h1>Notícias</h1>
  <p>Meu Jornal</p>
</header>

<div class="container">

  <div class="noticia">
    <img src="imagem1.jpg" alt="Notícia 1">
    <h2>Primeira notícia</h2>
    <p>Resumo da primeira notícia.</p>
    <a class="botao" href="leitura.html">Notícia completa</a>
  </div>

  <div class="noticia">
    <img src="imagem2.jpg" alt="Notícia 2">
    <h2>Segunda notícia</h2>
    <p>Resumo da segunda notícia.</p>
    <a class="botao" href="leitura.html">Notícia completa</a>
  </div>

  <div class="noticia">
    <img src="imagem3.jpg" alt="Notícia 3">
    <h2>Terceira notícia</h2>
    <p>Resumo da terceira notícia.</p>
    <a class="botao" href="leitura.html">Notícia completa</a>
  </div>

</div>

</body>
</html>
