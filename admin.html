<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Jornal - Administração</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f3f6;
color:#222;
}

header{
background:#111827;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:7px 0 0;
color:#d1d5db;
}

nav{
background:white;
padding:12px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
}

nav a{
text-decoration:none;
color:#111827;
background:#e5e7eb;
padding:9px 13px;
border-radius:
  6px;
font-weight:bold;
}

.container{
width:94%;
max-width:1000px;
margin:20px auto;
}

.caixa{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.caixa h2{
margin-top:0;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
margin-bottom:12px;
}

button{
border:0;
padding:11px 15px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-entrar{
background:#111827;
color:white;
}

.btn-publicar{
background:#16a34a;
color:white;
}

.btn-rendimento{
background:#7c3aed;
color:white;
}

.btn-sair{
background:#dc2626;
color:white;
}

.painel{
display:none;
}

.resumos{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:20px;
}

.resumo{
background:#f3f4f6;
padding:17px;
border-radius:9px;
text-align:center;
}

.resumo span{
display:block;
color:#666;
font-size:14px;
}

.resumo strong{
display:block;
font-size:25px;
margin-top:6px;
}

.botoes{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.erro{
color:#dc2626;
margin-top:10px;
}

@media(max-width:700px){

.resumos{
grid-template-columns:repeat(2,1fr);
}

.botoes button{
width:100%;
}

}

</style>
</head>

<body>

<header>

<h1>MEU JORNAL</h1>

<p>Painel de Administração</p>

</header>

<nav>

<a href="./index.html">INÍCIO</a>

<a href="./publicar.html">PUBLICAR</a>

<a href="./noticias.html">NOTÍCIAS</a>

<a href="./rendimento.html">RENDIMENTO</a>

</nav>

<div class="container">

<div class="caixa" id="login">

<h2>Acesso administrativo</h2>

<p>Digite a senha para entrar.</p>

<input
type="password"
id="senha"
placeholder="Digite a senha"
>

<button
type="button"
class="btn-entrar"
onclick="entrar()"
>
ENTRAR
</button>

<div id="mensagemLogin"></div>

</div>

<div id="painel" class="painel">

<div class="caixa">

<h2>Resumo</h2>

<div class="resumos">

<div class="resumo">
<span>Notícias</span>
<strong id="totalNoticias">0</strong>
</div>

<div class="resumo">
<span>Visualizações</span>
<strong id="totalVisualizacoes">0</strong>
</div>

<div class="resumo">
<span>Publicidade</span>
<strong id="totalPublicidade">0,00 MT</strong>
</div>

<div class="resumo">
<span>Rendimento total</span>
<strong id="totalRendimento">0,00 MT</strong>
</div>

</div>

<div class="botoes">

<button
type="button"
class="btn-publicar"
onclick="publicar()"
>
PUBLICAR NOTÍCIA
</button>

<button
type="button"
class="btn-rendimento"
onclick="rendimento()"
>
VER RENDIMENTO
</button>

<button
type="button"
class="btn-sair"
onclick="sair()"
>
SAIR
</button>

</div>

</div>

</div>

</div>

<footer>
MEU JORNAL
</footer>

<script>

function entrar(){

var senha =
document.getElementById("senha").value;

var senhaGuardada =
localStorage.getItem("meuJornalSenha");

if(senhaGuardada === null){

senhaGuardada="1234";

localStorage.setItem(
"meuJornalSenha",
"1234"
);

}

if(senha === senhaGuardada){

document.getElementById(
"login"
).style.display="none";

document.getElementById(
"painel"
).style.display="block";

atualizarResumo();

}else{

document.getElementById(
"mensagemLogin"
).className="erro";

document.getElementById(
"mensagemLogin"
).innerText=
"Senha incorreta.";

}

}

function atualizarResumo(){

var noticias =
JSON.parse(
localStorage.getItem(
"meuJornalNoticias"
)
) || [];

var visualizacoes =
parseInt(
localStorage.getItem(
"meuJornalVisualizacoes"
)
) || 0;

var publicidade =
parseFloat(
localStorage.getItem(
"meuJornalPublicidade"
)
) || 0;

var total =
parseFloat(
localStorage.getItem(
"meuJornalTotal"
)
) || 0;

document.getElementById(
"totalNoticias"
).innerText=
noticias.length;

document.getElementById(
"totalVisualizacoes"
).innerText=
visualizacoes;

document.getElementById(
"totalPublicidade"
).innerText=
publicidade.toFixed(2)
.replace(".",",")+" MT";

document.getElementById(
"totalRendimento"
).innerText=
total.toFixed(2)
.replace(".",",")+" MT";

}

function publicar(){

window.location.href="./publicar.html";

}

function rendimento(){

window.location.href="./rendimento.html";

}

function sair(){

document.getElementById(
"painel"
).style.display="none";

document.getElementById(
"login"
).style.display="block";

document.getElementById(
"senha"
).value="";

}

</script>

</body>
</html>
