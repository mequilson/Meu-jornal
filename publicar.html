<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Jornal - Publicar notícia</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
}

nav {
  background: white;
  padding: 14px;
  text-align: center;
}

nav a {
  color: #111;
  text-decoration: none;
  margin: 0 8px;
  font-weight: bold;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 15px;
}

.caixa {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

h2 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

textarea {
  min-height: 180px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: 0;
  border-radius: 6px;
  background: #111;
  color: white;
  font-size: 17px;
}

.botao-limpar {
  background: #777;
}

#preview {
  display: none;
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  margin-top: 15px;
  border-radius: 8px;
}

#mensagem {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>MEU JORNAL</h1>
</header>

<nav>
<a href="index.html">Início</a>
<a href="noticias.html">Notícias</a>
<a href="publicar.html">Publicar</a>
</nav>

<div class="container">

<div class="caixa">

<h2>Publicar notícia</h2>

<label>Autor</label>
<input type="text" id="autor" placeholder="Nome do autor">

<label>Data</label>
<input type="date" id="data">

<label>Título da notícia</label>
<input type="text" id="titulo" placeholder="Digite o título">

<label>Categoria</label>

<select id="categoria">

<option value="">Escolha uma categoria</option>
<option value="Educação">Educação</option>
<option value="Novas Tecnologias">Novas Tecnologias</option>
<option value="Política">Política</option>
<option value="Economia">Economia</option>
<option value="Desporto">Desporto</option>
<option value="Sociedade">Sociedade</option>
<option value="Saúde">Saúde</option>
<option value="Cultura">Cultura</option>
<option value="Outras">Outras</option>

</select>

<label>Texto da notícia</label>

<textarea id="texto"
placeholder="Escreva a notícia completa"></textarea>

<label>Imagem da notícia</label>

<input
type="file"
id="imagem"
accept="image/*">

<img id="preview">

<button onclick="publicarNoticia()">
Publicar notícia
</button>

<button
class="botao-limpar"
onclick="limparFormulario()">
Limpar
</button>

<div id="mensagem"></div>

</div>
</div>


<script>

let imagemBase64 = "";


/* DATA */

document.getElementById("data").value =
new Date().toISOString().split("T")[0];


/* ESCOLHER IMAGEM */

document.getElementById("imagem").addEventListener(
"change",
function() {

const arquivo = this.files[0];

if (!arquivo) {
return;
}

const preview =
document.getElementById("preview");


/*
Mostra a imagem imediatamente
*/

const endereco =
URL.createObjectURL(arquivo);

preview.src = endereco;
preview.style.display = "block";


/*
Transforma a imagem em uma versão
menor e permanente.
*/

const img = new Image();

img.onload = function() {

const tamanhoMaximo = 1000;

let largura = img.width;
let altura = img.height;


if (largura > tamanhoMaximo) {

altura =
altura * tamanhoMaximo / largura;

largura =
tamanhoMaximo;

}


if (altura > tamanhoMaximo) {

largura =
largura * tamanhoMaximo / altura;

altura =
tamanhoMaximo;

}


const canvas =
document.createElement("canvas");

canvas.width = Math.round(largura);
canvas.height = Math.round(altura);

const contexto =
canvas.getContext("2d");

contexto.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);


/*
JPEG comprimido.
*/

imagemBase64 =
canvas.toDataURL(
"image/jpeg",
0.70
);

URL.revokeObjectURL(endereco);

};

img.onerror = function() {

document.getElementById("mensagem").textContent =
"Não foi possível preparar a imagem.";

};

img.src = endereco;

});


/* PUBLICAR */

function publicarNoticia() {

const autor =
document.getElementById("autor").value.trim();

const data =
document.getElementById("data").value;

const titulo =
document.getElementById("titulo").value.trim();

const categoria =
document.getElementById("categoria").value;

const texto =
document.getElementById("texto").value.trim();

const mensagem =
document.getElementById("mensagem");


if (!titulo) {

mensagem.textContent =
"Digite o título da notícia.";

return;

}


if (!texto) {

mensagem.textContent =
"Digite o texto da notícia.";

return;

}


if (!categoria) {

mensagem.textContent =
"Escolha uma categoria.";

return;

}


/*
Se a imagem ainda estiver a ser preparada,
espera um pouco.
*/

if (
document.getElementById("imagem").files.length > 0 &&
!imagemBase64
) {

mensagem.textContent =
"A preparar a imagem. Aguarde um momento e clique novamente.";

return;

}


let noticias = [];

try {

noticias =
JSON.parse(
localStorage.getItem(
"meuJornalNoticias"
)
) || [];

} catch(e) {

noticias = [];

}


/*
Criar notícia
*/

const noticia = {

autor: autor,

data: data,

titulo: titulo,

categoria: categoria,

texto: texto,

imagem: imagemBase64 || "",

dataCriacao:
new Date().toISOString()

};


/*
Adicionar no fim.
*/

noticias.push(noticia);


/*
Guardar tudo.
*/

try {

localStorage.setItem(
"meuJornalNoticias",
JSON.stringify(noticias)
);

mensagem.textContent =
"Notícia publicada com sucesso.";

limparFormularioDepois();

} catch(e) {

mensagem.textContent =
"A imagem é muito grande. Escolha uma imagem menor.";

}

}


/* LIMPAR DEPOIS DE PUBLICAR */

function limparFormularioDepois() {

document.getElementById("autor").value = "";

document.getElementById("titulo").value = "";

document.getElementById("categoria").value = "";

document.getElementById("texto").value = "";

document.getElementById("imagem").value = "";

document.getElementById("preview").src = "";

document.getElementById("preview").style.display = "none";

imagemBase64 = "";

document.getElementById("data").value =
new Date().toISOString().split("T")[0];

}


/* LIMPAR */

function limparFormulario() {

document.getElementById("autor").value = "";

document.getElementById("titulo").value = "";

document.getElementById("categoria").value = "";

document.getElementById("texto").value = "";

document.getElementById("imagem").value = "";

document.getElementById("preview").src = "";

document.getElementById("preview").style.display = "none";

document.getElementById("mensagem").textContent = "";

imagemBase64 = "";

document.getElementById("data").value =
new Date().toISOString().split("T")[0];

}

</script>

</body>
</html>
